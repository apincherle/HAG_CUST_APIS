spring.datasource.url=jdbc:h2:mem:hags_shopify_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Quote SQL keywords (year, value, etc.) when H2 auto-generates schema
spring.jpa.properties.hibernate.auto_quote_keyword=true

shopify.webhook.enabled=true
shopify.webhook.secret=test-webhook-secret
shopify.webhook.verify-hmac=true
shopify.shop.domain=h-a-g-s.myshopify.com

shopify.tier-sku-mapping.HAGS-SUB-BRONZE=BRONZE
shopify.tier-sku-mapping.HAGS-SUB-SILVER=SILVER
shopify.tier-sku-mapping.HAGS-SUB-GOLD=GOLD
shopify.tier-cards-allowed.BRONZE=10
shopify.tier-cards-allowed.SILVER=25
shopify.tier-cards-allowed.GOLD=50

logging.level.com.example.shopify=DEBUG
