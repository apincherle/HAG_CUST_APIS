server.port=8001

# Active profile (dev uses SQLite, prod uses Azure SQL)
# Set via environment variable: SPRING_PROFILES_ACTIVE=dev or SPRING_PROFILES_ACTIVE=prod
# Default to dev if not specified
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Actuator (health only exposed by profile; prod enables k8s-style probes)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Swagger/OpenAPI Configuration
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.example.controller,com.example.qrcert.controller
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
# Prefer configured OpenAPI servers (not petstore localhost default)
springdoc.swagger-ui.disable-swagger-default-url=true

# Logging configuration
logging.level.com.example=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

# QR Certificate Configuration
qr.certificate.base-url=${QR_BASE_URL:https://jolly-ground-02380ae03.7.azurestaticapps.net}
qr.certificate.secret=${QR_CERT_SECRET:change-me-please}
qr.certificate.qr-storage-path=${QR_STORAGE_PATH:./static/qrs}
qr.certificate.serial-prefix=${QR_SERIAL_PREFIX:HAGS}
qr.certificate.verification-path=${QR_VERIFICATION_PATH:/cert}

# Shopify webhooks (override via env / docker-compose)
shopify.webhook.enabled=${SHOPIFY_WEBHOOK_ENABLED:true}
shopify.webhook.secret=${SHOPIFY_WEBHOOK_SECRET:}
shopify.webhook.verify-hmac=${SHOPIFY_WEBHOOK_VERIFY_HMAC:true}
shopify.webhook.log-payload=${SHOPIFY_WEBHOOK_LOG_PAYLOAD:false}
shopify.shop.domain=${SHOPIFY_SHOP_DOMAIN:}

# SKU -> tier code (match Shopify product variant SKUs)
shopify.tier-sku-mapping.HAGS-SUB-BRONZE=BRONZE
shopify.tier-sku-mapping.HAGS-SUB-SILVER=SILVER
shopify.tier-sku-mapping.HAGS-SUB-GOLD=GOLD

# Tier -> cards allowed per entitlement line item
shopify.tier-cards-allowed.BRONZE=10
shopify.tier-cards-allowed.SILVER=25
shopify.tier-cards-allowed.GOLD=50

logging.level.com.example.shopify=INFO