# Build, push to ACR, and deploy to Azure Container Apps (HAGS)

trigger:
  - master

resources:
  - repo: self

variables:
  # Azure / ACR
  azureSubscription: 'HAGS-ACR-hagsreg'   # AzureRM service connection name
  azureSubscriptionId: '28f3f51f-dea2-4c31-8944-7ff34b40dc96'
  imageRepository: 'hags-customer-api'
  containerRegistry: 'hagsreg.azurecr.io'
  acrName: 'hagsreg'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  buildContext: '$(Build.SourcesDirectory)'
  tag: '$(Build.BuildId)'

  # Container Apps
  resourceGroup: 'rg-hags-prod'
  containerAppName: 'hags-customer-api'
  containerAppEnv: 'hags-env'
  managedIdentity: 'hags-ca-mi'
  containerTargetPort: '8001'
  KeyVaultName: 'kv-hags-prod'

  # Agent
  vmImageName: 'ubuntu-latest'

  # Build/Test
  mavenCacheFolder: $(Pipeline.Workspace)/.m2/repository

stages:
  - stage: Build
    displayName: Build and push stage
    jobs:
      - job: Build
        displayName: Build
        pool:
          vmImage: $(vmImageName)
        services:
          postgres:
            image: postgres:15-alpine
            env:
              POSTGRES_DB: hags_customer
              POSTGRES_USER: hags_user
              POSTGRES_PASSWORD: hags_password
            ports:
              - 5432:5432
        steps:
          - checkout: self
            fetchDepth: 1

          - task: Cache@2
            displayName: Cache Maven local repo
            inputs:
              key: 'maven | "$(Agent.OS)" | pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
              path: $(mavenCacheFolder)

          - task: Maven@3
            displayName: mvn clean verify
            inputs:
              mavenPomFile: pom.xml
              goals: clean verify
              jdkVersionOption: '1.17'
              jdkArchitectureOption: x64
              mavenVersionOption: Default
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              javaHomeOption: JDKVersion
              mavenOptions: '-Xmx3072m -Dmaven.repo.local=$(mavenCacheFolder)'

          - task: AzureCLI@2
            displayName: Build and push image to ACR
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az acr login --name "$(acrName)"
                docker build -f "$(dockerfilePath)" -t "$(containerRegistry)/$(imageRepository):$(tag)" "$(buildContext)"
                docker push "$(containerRegistry)/$(imageRepository):$(tag)"

  - stage: Deploy
    displayName: Deploy to Azure Container Apps
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - deployment: Deploy
        displayName: Deploy to Azure Container Apps
        pool:
          vmImage: $(vmImageName)
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureKeyVault@2
                  displayName: Download secret keys
                  inputs:
                    azureSubscription: $(azureSubscription)
                    KeyVaultName: $(KeyVaultName)
                    SecretsFilter: "azure-sql-server,azure-sql-database,azure-sql-username,azure-sql-password,azure-sql-port,shopify-webhook-secret,shopify-shop-domain,shopify-webhook-enabled,shopify-webhook-verify-hmac,qr-cert-secret"
                    RunAsPreJob: False

                - task: AzureCLI@2
                  displayName: Deploy to Container Apps
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      set -euo pipefail
                      az extension add --name containerapp --upgrade --only-show-errors

                      # Validate required runtime variables are present before deploy.
                      required_vars=(
                        "AZURE-SQL-SERVER"
                        "AZURE-SQL-DATABASE"
                        "AZURE-SQL-USERNAME"
                        "AZURE-SQL-PASSWORD"
                        "AZURE-SQL-PORT"
                        "SHOPIFY-WEBHOOK-SECRET"
                        "SHOPIFY-SHOP-DOMAIN"
                        "SHOPIFY-WEBHOOK-ENABLED"
                        "SHOPIFY-WEBHOOK-VERIFY-HMAC"
                        "QR-CERT-SECRET"
                      )
                      for var_name in "${required_vars[@]}"; do
                        var_value="$(printenv "$var_name" || true)"
                        if [ -z "$var_value" ]; then
                          echo "Missing required variable from Key Vault/pipeline: ${var_name}"
                          exit 1
                        fi
                      done

                      # Map dashed Key Vault secret names to underscored runtime env vars.
                      AZURE_SQL_SERVER="$(printenv AZURE-SQL-SERVER)"
                      AZURE_SQL_DATABASE="$(printenv AZURE-SQL-DATABASE)"
                      AZURE_SQL_USERNAME="$(printenv AZURE-SQL-USERNAME)"
                      AZURE_SQL_PASSWORD="$(printenv AZURE-SQL-PASSWORD)"
                      AZURE_SQL_PORT="$(printenv AZURE-SQL-PORT)"
                      SHOPIFY_WEBHOOK_SECRET="$(printenv SHOPIFY-WEBHOOK-SECRET)"
                      SHOPIFY_SHOP_DOMAIN="$(printenv SHOPIFY-SHOP-DOMAIN)"
                      SHOPIFY_WEBHOOK_ENABLED="$(printenv SHOPIFY-WEBHOOK-ENABLED)"
                      SHOPIFY_WEBHOOK_VERIFY_HMAC="$(printenv SHOPIFY-WEBHOOK-VERIFY-HMAC)"
                      QR_CERT_SECRET="$(printenv QR-CERT-SECRET)"

                      IMAGE_REF="$(containerRegistry)/$(imageRepository):$(tag)"
                      IDENTITY_RESOURCE_ID="/subscriptions/$(azureSubscriptionId)/resourcegroups/$(resourceGroup)/providers/Microsoft.ManagedIdentity/userAssignedIdentities/$(managedIdentity)"

                      if az containerapp show --name $(containerAppName) --resource-group $(resourceGroup) &>/dev/null; then
                        # Update existing container app
                        az containerapp update \
                          --name $(containerAppName) \
                          --resource-group $(resourceGroup) \
                          --image "$IMAGE_REF" \
                          --query properties.configuration.ingress.fqdn \
                          --set-env-vars \
                            SPRING_PROFILES_ACTIVE=prod \
                            AZURE_SQL_SERVER=$(AZURE_SQL_SERVER) \
                            AZURE_SQL_DATABASE=$(AZURE_SQL_DATABASE) \
                            AZURE_SQL_USERNAME=$(AZURE_SQL_USERNAME) \
                            AZURE_SQL_PASSWORD=$(AZURE_SQL_PASSWORD) \
                            AZURE_SQL_PORT=$(AZURE_SQL_PORT) \
                            SHOPIFY_WEBHOOK_SECRET=$(SHOPIFY_WEBHOOK_SECRET) \
                            SHOPIFY_SHOP_DOMAIN=$(SHOPIFY_SHOP_DOMAIN) \
                            SHOPIFY_WEBHOOK_ENABLED=$(SHOPIFY_WEBHOOK_ENABLED) \
                            SHOPIFY_WEBHOOK_VERIFY_HMAC=$(SHOPIFY_WEBHOOK_VERIFY_HMAC) \
                            QR_CERT_SECRET=$(QR_CERT_SECRET)
                      else
                        # Create new container app
                        az containerapp create \
                          --name $(containerAppName) \
                          --resource-group $(resourceGroup) \
                          --environment $(containerAppEnv) \
                          --image "$IMAGE_REF" \
                          --target-port $(containerTargetPort) \
                          --ingress external \
                          --registry-server $(containerRegistry) \
                          --user-assigned "$IDENTITY_RESOURCE_ID" \
                          --registry-identity "$IDENTITY_RESOURCE_ID" \
                          --query properties.configuration.ingress.fqdn \
                          --env-vars \
                            SPRING_PROFILES_ACTIVE=prod \
                            AZURE_SQL_SERVER=$(AZURE_SQL_SERVER) \
                            AZURE_SQL_DATABASE=$(AZURE_SQL_DATABASE) \
                            AZURE_SQL_USERNAME=$(AZURE_SQL_USERNAME) \
                            AZURE_SQL_PASSWORD=$(AZURE_SQL_PASSWORD) \
                            AZURE_SQL_PORT=$(AZURE_SQL_PORT) \
                            SHOPIFY_WEBHOOK_SECRET=$(SHOPIFY_WEBHOOK_SECRET) \
                            SHOPIFY_SHOP_DOMAIN=$(SHOPIFY_SHOP_DOMAIN) \
                            SHOPIFY_WEBHOOK_ENABLED=$(SHOPIFY_WEBHOOK_ENABLED) \
                            SHOPIFY_WEBHOOK_VERIFY_HMAC=$(SHOPIFY_WEBHOOK_VERIFY_HMAC) \
                            QR_CERT_SECRET=$(QR_CERT_SECRET)
                      fi
