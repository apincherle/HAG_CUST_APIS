# Build, push to ACR, and deploy to Azure Container Apps (HAGS)

trigger:
  - master

resources:
  - repo: self

variables:
  # Azure / ACR
  azureSubscription: 'HAGS-ACR-hagsreg'   # AzureRM service connection name
  azureSubscriptionId: '28f3f51f-dea2-4c31-8944-7ff34b40dc96'
  imageRepository: 'hags-customer-api'
  containerRegistry: 'hagsreg.azurecr.io'
  acrName: 'hagsreg'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  buildContext: '$(Build.SourcesDirectory)'
  tag: '$(Build.BuildId)'

  # Container Apps
  resourceGroup: 'rg-hags-prod'
  containerAppName: 'hags-customer-api'
  containerAppEnv: 'hags-env'
  managedIdentity: 'hags-ca-mi'
  containerTargetPort: '8001'
  KeyVaultName: 'kv-hags-prod'

  # Agent
  vmImageName: 'ubuntu-latest'

  # Build/Test
  mavenCacheFolder: $(Pipeline.Workspace)/.m2/repository

stages:
  - stage: Build
    displayName: Build and push stage
    jobs:
      - job: Build
        displayName: Build
        pool:
          vmImage: $(vmImageName)
        services:
          postgres:
            image: postgres:15-alpine
            env:
              POSTGRES_DB: hags_customer
              POSTGRES_USER: hags_user
              POSTGRES_PASSWORD: hags_password
            ports:
              - 5432:5432
        steps:
          - checkout: self
            fetchDepth: 1

          - task: Cache@2
            displayName: Cache Maven local repo
            inputs:
              key: 'maven | "$(Agent.OS)" | pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
              path: $(mavenCacheFolder)

          - task: Maven@3
            displayName: mvn clean verify
            inputs:
              mavenPomFile: pom.xml
              goals: clean verify
              jdkVersionOption: '1.17'
              jdkArchitectureOption: x64
              mavenVersionOption: Default
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              javaHomeOption: JDKVersion
              mavenOptions: '-Xmx3072m -Dmaven.repo.local=$(mavenCacheFolder)'

          - task: PublishCodeCoverageResults@2
            displayName: Publish JaCoCo coverage
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/target/site/jacoco/jacoco.xml'
              pathToSources: '$(System.DefaultWorkingDirectory)/src/main/java'
              failIfCoverageEmpty: false

          - task: AzureCLI@2
            displayName: Build and push image to ACR
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az acr login --name "$(acrName)"
                docker build -f "$(dockerfilePath)" -t "$(containerRegistry)/$(imageRepository):$(tag)" "$(buildContext)"
                docker push "$(containerRegistry)/$(imageRepository):$(tag)"

  - stage: Deploy
    displayName: Deploy to Azure Container Apps
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - deployment: Deploy
        displayName: Deploy to Azure Container Apps
        pool:
          vmImage: $(vmImageName)
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                # Deploy only updates the container image. Create the app once in Azure Portal
                # (see doc/azure_container_app_first_deploy.md). Env vars: set on the app in Portal
                # or in Key Vault for your reference — not injected by this stage.
                - task: AzureCLI@2
                  displayName: Deploy image to Container App
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      set -euo pipefail

                      APP_NAME="$(containerAppName)"
                      RG="$(resourceGroup)"
                      IMAGE_REF="$(containerRegistry)/$(imageRepository):$(tag)"

                      if ! az containerapp show --name "$APP_NAME" --resource-group "$RG" &>/dev/null; then
                        echo "##vso[task.logissue type=error]Container App '$APP_NAME' was not found in resource group '$RG'."
                        echo ""
                        echo "This pipeline does NOT run 'az containerapp create' (Azure CLI bug on first create)."
                        echo "Create the app once in Azure Portal, then re-run Deploy."
                        echo ""
                        echo "Portal checklist:"
                        echo "  - Resource group: $RG"
                        echo "  - Container Apps environment: $(containerAppEnv)"
                        echo "  - App name: $APP_NAME"
                        echo "  - Image: $IMAGE_REF  (use latest Build ID tag from ACR if this tag missing)"
                        echo "  - Ingress: external, target port $(containerTargetPort)"
                        echo "  - Registry: $(containerRegistry), identity $(managedIdentity) with AcrPull"
                        echo "  - Environment variables: set manually (SPRING_PROFILES_ACTIVE=prod, AZURE_SQL_*, SHOPIFY_*, QR_CERT_SECRET)"
                        echo ""
                        echo "Guide: doc/azure_container_app_first_deploy.md"
                        exit 1
                      fi

                      echo "Updating $APP_NAME -> $IMAGE_REF"
                      FQDN="$(az containerapp update \
                        --name "$APP_NAME" \
                        --resource-group "$RG" \
                        --image "$IMAGE_REF" \
                        --query properties.configuration.ingress.fqdn -o tsv)"
                      echo "Deployed. URL: https://${FQDN}"
