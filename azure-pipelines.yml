# HAG Customer API — build, test, push to ACR, deploy to Azure Web App for Containers
#
# Configure in Azure DevOps (Pipeline → Edit → Variables, or Library variable group):
#   azureServiceConnection   — Azure Resource Manager service connection name
#   containerRegistry        — Docker Registry service connection (ACR)
#   acrLoginServer           — hagsreg.azurecr.io (see azure/hags-azure-details.yml)
#   webAppName               — Azure Web App name (Linux container)
#   imageRepository          — optional override (default: hags-customer-api)
#
# Web App application settings (prod) — set in Azure Portal, not in this file:
#   SPRING_PROFILES_ACTIVE=prod
#   AZURE_SQL_* , SHOPIFY_* , QR_* , etc.

trigger:
  branches:
    include:
      - master
      - main

pr:
  branches:
    include:
      - master
      - main

parameters:
  - name: enableDocker
    type: boolean
    default: false
  - name: enableDeploy
    type: boolean
    default: false
  - name: azureServiceConnection
    type: string
    default: 'HAGS-ACR-hagsreg'
  - name: webAppName
    type: string
    default: 'hags-customer-api'
  - name: acrLoginServer
    type: string
    default: 'hagsreg.azurecr.io'
  - name: acrName
    type: string
    default: 'hagsreg'

variables:
  javaVersion: '17'
  imageRepository: 'hags-customer-api'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  mavenCacheFolder: $(Pipeline.Workspace)/.m2/repository
  azureSubscriptionId: '28f3f51f-dea2-4c31-8944-7ff34b40dc96'
  acrName: 'hagsreg'

stages:
  # ---------------------------------------------------------------------------
  - stage: BuildAndTest
    displayName: Build and test
    jobs:
      - job: Maven
        displayName: Maven (JDK 17) + PostgreSQL
        pool:
          vmImage: ubuntu-latest
        services:
          postgres:
            image: postgres:15-alpine
            env:
              POSTGRES_DB: hags_customer
              POSTGRES_USER: hags_user
              POSTGRES_PASSWORD: hags_password
            ports:
              - 5432:5432
        steps:
          - checkout: self
            fetchDepth: 1

          - task: Cache@2
            displayName: Cache Maven local repo
            inputs:
              key: 'maven | "$(Agent.OS)" | pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
              path: $(mavenCacheFolder)

          - task: Maven@3
            displayName: mvn clean verify
            inputs:
              mavenPomFile: pom.xml
              goals: clean verify
              jdkVersionOption: '1.17'
              jdkArchitectureOption: x64
              mavenVersionOption: Default
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              javaHomeOption: JDKVersion
              mavenOptions: '-Xmx3072m -Dmaven.repo.local=$(mavenCacheFolder)'

          - task: PublishCodeCoverageResults@2
            displayName: Publish code coverage (if JaCoCo added later)
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/site/jacoco/jacoco.xml'
            continueOnError: true

  # ---------------------------------------------------------------------------
  - ${{ if eq(parameters.enableDocker, true) }}:
    - stage: Docker
      displayName: Build and push image
      dependsOn: BuildAndTest
      condition: succeeded()
      jobs:
        - job: PushImage
          displayName: Docker build → ACR
          pool:
            vmImage: ubuntu-latest
          steps:
            - checkout: self
              fetchDepth: 1

            - task: AzureCLI@2
              displayName: Build and push to ACR (AzureCLI)
              inputs:
                azureSubscription: ${{ parameters.azureServiceConnection }}
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -euo pipefail
                  az acr login --name "${{ parameters.acrName }}"
                  docker build -f "$(dockerfilePath)" -t "${{ parameters.acrLoginServer }}/$(imageRepository):$(Build.BuildId)" "$(Build.SourcesDirectory)"
                  docker tag "${{ parameters.acrLoginServer }}/$(imageRepository):$(Build.BuildId)" "${{ parameters.acrLoginServer }}/$(imageRepository):$(Build.SourceBranchName)"
                  docker tag "${{ parameters.acrLoginServer }}/$(imageRepository):$(Build.BuildId)" "${{ parameters.acrLoginServer }}/$(imageRepository):latest"
                  docker push "${{ parameters.acrLoginServer }}/$(imageRepository):$(Build.BuildId)"
                  docker push "${{ parameters.acrLoginServer }}/$(imageRepository):$(Build.SourceBranchName)"
                  docker push "${{ parameters.acrLoginServer }}/$(imageRepository):latest"

            - script: |
                echo "##vso[task.setvariable variable=fullImageName;isOutput=true]${{ parameters.acrLoginServer }}/$(imageRepository):$(Build.BuildId)"
              name: imageTag
              displayName: Export image tag variable

  # ---------------------------------------------------------------------------
  - ${{ if and(eq(parameters.enableDocker, true), eq(parameters.enableDeploy, true)) }}:
    - stage: Deploy
      displayName: Deploy to Azure
      dependsOn: Docker
      condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/master'), eq(variables['Build.SourceBranch'], 'refs/heads/main')))
      jobs:
        - deployment: DeployWebApp
          displayName: Deploy Web App for Containers
          pool:
            vmImage: ubuntu-latest
          environment: production
          strategy:
            runOnce:
              deploy:
                steps:
                  - task: AzureWebAppContainer@1
                    displayName: Deploy container to ${{ parameters.webAppName }}
                    inputs:
                      azureSubscription: ${{ parameters.azureServiceConnection }}
                      appName: ${{ parameters.webAppName }}
                      imageName: '${{ parameters.acrLoginServer }}/$(imageRepository):$(Build.BuildId)'
                      containerCommand: ''
