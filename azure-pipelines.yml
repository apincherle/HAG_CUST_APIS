# HAG Customer API — build, test, push to ACR, deploy to Azure Web App for Containers
#
# Configure in Azure DevOps (Pipeline → Edit → Variables, or Library variable group):
#   azureServiceConnection   — Azure Resource Manager service connection name
#   containerRegistry        — Docker Registry service connection (ACR)
#   acrLoginServer           — hagsreg.azurecr.io (see azure/hags-azure-details.yml)
#   webAppName               — Azure Web App name (Linux container)
#   imageRepository          — optional override (default: hags-customer-api)
#
# Web App application settings (prod) — set in Azure Portal, not in this file:
#   SPRING_PROFILES_ACTIVE=prod
#   AZURE_SQL_* , SHOPIFY_* , QR_* , etc.

trigger:
  branches:
    include:
      - master
      - main

pr:
  branches:
    include:
      - master
      - main

variables:
  javaVersion: '17'
  imageRepository: 'hags-customer-api'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  mavenCacheFolder: $(Pipeline.Workspace)/.m2/repository
  # See azure/hags-azure-details.yml — override service connection names in DevOps if different
  azureSubscriptionId: '28f3f51f-dea2-4c31-8944-7ff34b40dc96'
  azureServiceConnection: 'HAGS-Azure-Prod'
  containerRegistry: 'HAGS-ACR-hagsreg'
  acrName: 'hagsreg'
  acrLoginServer: 'hagsreg.azurecr.io'
  webAppName: 'hags-customer-api'

stages:
  # ---------------------------------------------------------------------------
  - stage: BuildAndTest
    displayName: Build and test
    jobs:
      - job: Maven
        displayName: Maven (JDK 17) + PostgreSQL
        pool:
          vmImage: ubuntu-latest
        services:
          postgres:
            image: postgres:15-alpine
            env:
              POSTGRES_DB: hags_customer
              POSTGRES_USER: hags_user
              POSTGRES_PASSWORD: hags_password
            ports:
              - 5432:5432
        steps:
          - checkout: self
            fetchDepth: 1

          - task: Cache@2
            displayName: Cache Maven local repo
            inputs:
              key: 'maven | "$(Agent.OS)" | pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
              path: $(mavenCacheFolder)

          - task: Maven@3
            displayName: mvn clean verify
            inputs:
              mavenPomFile: pom.xml
              goals: clean verify
              jdkVersionOption: '1.17'
              jdkArchitectureOption: x64
              mavenVersionOption: Default
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              javaHomeOption: JDKVersion
              mavenOptions: '-Xmx3072m -Dmaven.repo.local=$(mavenCacheFolder)'

          - task: PublishCodeCoverageResults@2
            displayName: Publish code coverage (if JaCoCo added later)
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/site/jacoco/jacoco.xml'
            continueOnError: true

  # ---------------------------------------------------------------------------
  - stage: Docker
    displayName: Build and push image
    dependsOn: BuildAndTest
    condition: succeeded()
    jobs:
      - job: PushImage
        displayName: Docker build → ACR
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            fetchDepth: 1

          - task: Docker@2
            displayName: Build and push to ACR
            inputs:
              command: buildAndPush
              containerRegistry: $(containerRegistry)
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              buildContext: $(Build.SourcesDirectory)
              tags: |
                $(Build.BuildId)
                $(Build.SourceBranchName)
                latest

          - script: |
              echo "##vso[task.setvariable variable=fullImageName;isOutput=true]$(acrLoginServer)/$(imageRepository):$(Build.BuildId)"
            name: imageTag
            displayName: Export image tag variable

  # ---------------------------------------------------------------------------
  - stage: Deploy
    displayName: Deploy to Azure
    dependsOn: Docker
    condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/master'), eq(variables['Build.SourceBranch'], 'refs/heads/main')))
    jobs:
      - deployment: DeployWebApp
        displayName: Deploy Web App for Containers
        pool:
          vmImage: ubuntu-latest
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: Deploy container to $(webAppName)
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appName: $(webAppName)
                    imageName: '$(acrLoginServer)/$(imageRepository):$(Build.BuildId)'
                    containerCommand: ''
