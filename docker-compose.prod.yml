version: '3.8'

# Production-like run using an image from ACR (set after pipeline push):
#   set ACR_LOGIN_SERVER=yourregistry.azurecr.io
#   set IMAGE_TAG=12345
#   docker compose -f docker-compose.prod.yml up
services:
  app:
    image: ${ACR_LOGIN_SERVER:-hagsreg.azurecr.io}/hags-customer-api:${IMAGE_TAG:-latest}
    container_name: hags-customer-api-prod
    ports:
      - "8001:8001"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - AZURE_SQL_SERVER=${AZURE_SQL_SERVER}
      - AZURE_SQL_DATABASE=${AZURE_SQL_DATABASE}
      - AZURE_SQL_USERNAME=${AZURE_SQL_USERNAME}
      - AZURE_SQL_PASSWORD=${AZURE_SQL_PASSWORD}
      - AZURE_SQL_PORT=${AZURE_SQL_PORT:-1433}
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

